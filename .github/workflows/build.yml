# Сборка релизов для двух платформ из общей ветки main.
# Windows: EXE + ZIP. Raspberry Pi: tar.gz с исходниками и установщиком.
# Отдельные релизы: windows-latest и pi-latest.
name: Build Windows + Raspberry Pi releases
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
concurrency:
  group: releases-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt setuptools
      # FT8/FT4: модуль _ftx из ft8_lib (C, MIT) — собирается компилятором MSVC
      - name: Модуль FT8 (_ftx)
        working-directory: server
        run: python setup_ftx.py build_ext --inplace
      # Справочник стран для FT8 (Country Files, AD1C). Не скачался — программа скачает сама при запуске.
      - name: cty.dat
        shell: pwsh
        run: |
          try { Invoke-WebRequest https://www.country-files.com/cty/cty.dat -OutFile server\cty.dat -TimeoutSec 60 }
          catch { Write-Host "cty.dat не скачан: $_"; Set-Content server\cty.dat '' }
          (Get-Item server\cty.dat).Length
      # Загрузчик PyInstaller собираем из исходников: готовый загрузчик из pip
      # антивирусы (Microsoft Defender) часто ложно считают «Wacatac».
      - name: PyInstaller с собственным загрузчиком
        shell: pwsh
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = '1'
          pip install --no-binary pyinstaller --no-cache-dir pyinstaller
      - run: >
          pyinstaller --noconfirm --clean --onefile --windowed --noupx --name Yaesu-Web-Pult
          --version-file version_info.txt
          --icon web\icon.ico --add-data "web;web" --add-data "server\menu_ftx1.json;." --add-data "server\cty.dat;." --add-data "ftdi;ftdi"
          --hidden-import pystray._win32 --hidden-import _ftx
          --hidden-import hamlib_backend --hidden-import rtlsdr_scope --hidden-import ft710_scope
          --hidden-import ft4222_transport --hidden-import scope_download --hidden-import radio_backends --hidden-import ptt_serial
          --collect-all numpy --collect-all sounddevice
          --paths server server\main.py
      - name: Вариант-папка (ZIP) — реже вызывает подозрения антивируса
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --noupx --name Yaesu-Web-Pult --distpath distdir `
            --version-file version_info.txt `
            --icon web\icon.ico --add-data "web;web" --add-data "server\menu_ftx1.json;." --add-data "server\cty.dat;." --add-data "ftdi;ftdi" `
            --hidden-import pystray._win32 --hidden-import _ftx `
            --hidden-import hamlib_backend --hidden-import rtlsdr_scope --hidden-import ft710_scope `
            --hidden-import ft4222_transport --hidden-import scope_download --hidden-import radio_backends --hidden-import ptt_serial `
            --collect-all numpy --collect-all sounddevice `
            --paths server server\main.py
          # Bundle Hamlib and RTL-SDR tools into the folder/setup build.
          & .\install-hamlib.ps1 -Destination distdir\Yaesu-Web-Pult
          if (-not $?) { exit 1 }
          & .\install-rtlsdr.ps1 -Destination distdir\Yaesu-Web-Pult
          if (-not $?) { exit 1 }
          Compress-Archive -Path distdir\Yaesu-Web-Pult -DestinationPath dist\Yaesu-Web-Pult-folder.zip
          (Get-FileHash dist\Yaesu-Web-Pult.exe -Algorithm SHA256).Hash + '  Yaesu-Web-Pult.exe' | Out-File dist\SHA256.txt
          (Get-FileHash dist\Yaesu-Web-Pult-folder.zip -Algorithm SHA256).Hash + '  Yaesu-Web-Pult-folder.zip' | Out-File dist\SHA256.txt -Append
      - name: Проверка сборки
        shell: pwsh
        run: |
          if (-not (Test-Path dist\Yaesu-Web-Pult.exe)) {
            Write-Host "EXE not found"
            exit 1
          }
          $size = (Get-Item dist\Yaesu-Web-Pult.exe).Length / 1MB
          Write-Host "EXE size: $([math]::Round($size, 2)) MB"
          if ($size -lt 30) {
            Write-Host "EXE too small, likely incomplete"
            exit 1
          }
      - name: Selftest (наличие всех модулей в EXE)
        shell: pwsh
        run: |
          $rep = Join-Path $env:RUNNER_TEMP 'selftest.txt'
          $p = Start-Process -FilePath dist\Yaesu-Web-Pult.exe -ArgumentList '--selftest', $rep -Wait -PassThru
          if (Test-Path $rep) { Get-Content $rep }
          if ($p.ExitCode -ne 0) {
            Write-Host "Selftest failed: exit $($p.ExitCode)"
            exit 1
          }
      - name: Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Установщик Windows (Program Files + драйверы)
        shell: pwsh
        run: |
          .\deploy\windows\build-installer.ps1 -AppDir distdir\Yaesu-Web-Pult -OutDir dist
          if ($LASTEXITCODE -ne 0) { exit 1 }
          (Get-FileHash dist\Yaesu-Web-Pult-Setup.exe -Algorithm SHA256).Hash + '  Yaesu-Web-Pult-Setup.exe' | Out-File dist\SHA256.txt -Append
      - name: Check installed layout, migration and legacy permissions
        shell: pwsh
        run: .\deploy\windows\test-installer.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: Yaesu-Web-Pult-windows
          path: |
            dist/Yaesu-Web-Pult.exe
            dist/Yaesu-Web-Pult-folder.zip
            dist/Yaesu-Web-Pult-Setup.exe
            dist/SHA256.txt
      - name: Релиз Windows
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: windows-latest
          target_commitish: ${{ github.sha }}
          name: Yaesu Web Pult — Windows (latest)
          body: |
            ## 📥 Windows

            **Yaesu-Web-Pult-Setup.exe** — recommended: installs to `C:\Program Files\Yaesu Web Pult`
            and bundles Hamlib, RTL-SDR tools and FTDI/CP210x USB drivers.

            **Yaesu-Web-Pult.exe** — portable single file, download and run (no Python required)

            **Yaesu-Web-Pult-folder.zip** — portable folder version (less likely to trigger antivirus)

            ## 🔌 Drivers

            The setup installs FTDI (incl. FT4222) and Silicon Labs CP210x drivers.
            For RTL-SDR, use the **RTL-SDR (Zadig)** shortcut if Windows does not detect the dongle.

            ## ⚠️ Windows Defender / SmartScreen

            The setup and EXE are not code-signed. Windows may show a SmartScreen warning;
            choose «Подробнее» → «Выполнить». PyInstaller executables sometimes trigger
            false positives. All source code is open in this repository.

            ## 📦 Other platforms

            Raspberry Pi build: see the **pi-latest** release.

            **SHA256 checksums:** SHA256.txt

            **Build:** ${{ github.sha }}
          make_latest: false
          overwrite_files: true
          files: |
            dist/Yaesu-Web-Pult-Setup.exe
            dist/Yaesu-Web-Pult.exe
            dist/Yaesu-Web-Pult-folder.zip
            dist/SHA256.txt
            install-hamlib.ps1
            install-rtlsdr.ps1

      - name: Point latest tag at the published build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/windows-latest" -f "sha=$GITHUB_SHA" -F force=true

  pi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Справочник стран для FT8/DX. Файл в .gitignore, поэтому кладём его
      # в архив отдельно: на чистой установке страны доступны без интернета.
      - name: cty.dat
        run: |
          mkdir -p server
          curl -fsSL --max-time 60 https://www.country-files.com/cty/cty.dat -o server/cty.dat \
            || { echo "cty.dat недоступен"; : > server/cty.dat; }
          ls -l server/cty.dat
      - name: Собрать архив для Raspberry Pi
        run: |
          mkdir -p dist
          git archive --format=tar --prefix=yaesu-web-pult/ -o dist/yaesu-web-pult-pi.tar HEAD
          tar --append --file=dist/yaesu-web-pult-pi.tar --transform='s,^,yaesu-web-pult/,' server/cty.dat
          gzip -9 -c dist/yaesu-web-pult-pi.tar > dist/yaesu-web-pult-pi.tar.gz
          rm -f dist/yaesu-web-pult-pi.tar
          sha256sum dist/yaesu-web-pult-pi.tar.gz > dist/SHA256-pi.txt
          ls -lh dist/
      - uses: actions/upload-artifact@v7
        with:
          name: Yaesu-Web-Pult-pi
          path: |
            dist/yaesu-web-pult-pi.tar.gz
            dist/SHA256-pi.txt
      - name: Релиз Raspberry Pi
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pi-latest
          target_commitish: ${{ github.sha }}
          name: Yaesu Web Pult — Raspberry Pi (latest)
          body: |
            ## 📥 Raspberry Pi (headless)

            1. Download `yaesu-web-pult-pi.tar.gz`
            2. Extract and run the installer:
               ```bash
               tar -xzf yaesu-web-pult-pi.tar.gz
               cd yaesu-web-pult
               sudo bash deploy/install-rpi.sh
               ```
            3. The installer opens an interactive setup menu (whiptail):
               transceiver/CAT, Hamlib model, RX/TX audio, PTT, waterfall/SDR
               and the web-panel password. It then enables
               `yaesu-web-pult.service`.

            ## 📦 Other platforms

            Windows build: see the **windows-latest** release.

            **SHA256 checksum:** SHA256-pi.txt

            **Build:** ${{ github.sha }}
          make_latest: false
          overwrite_files: true
          files: |
            dist/yaesu-web-pult-pi.tar.gz
            dist/SHA256-pi.txt

      - name: Point latest tag at the published build
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/pi-latest" -f "sha=$GITHUB_SHA" -F force=true
