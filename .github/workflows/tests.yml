name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run tests
      run: |
        python -m unittest discover -s tests -v
    
    - name: Check code style (Python 3.12+ only)
      if: matrix.python-version >= '3.12'
      run: |
        pip install flake8
        flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  test-with-hamlib:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Download Hamlib
      run: |
        powershell -File .\install-hamlib.ps1
    
    - name: Run Hamlib integration tests
      env:
        HAMLIB_TEST_EXE: ${{ github.workspace }}\tools\hamlib\hamlib-w64-4.7.2\bin\rigctld.exe
      run: |
        python -m unittest discover -s tests -v
