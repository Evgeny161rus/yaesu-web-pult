version: '3.8'

services:
  yaesu-web-pult:
    build: .
    image: yaesu-web-pult:3.2-preview
    container_name: yaesu-web-pult
    restart: unless-stopped
    
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
    
    volumes:
      - yaesu-data:/data
      - /dev:/dev     # Доступ к USB устройствам
    
    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0  # COM-порт трансивера (настроить)
    
    # Для доступа к звуковым устройствам
    group_add:
      - audio
    
    environment:
      - FTX_SIMULATE=false
      - TZ=Europe/Moscow
    
    # Ограничения ресурсов
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 256M
    
    # Привилегии для доступа к USB
    privileged: false
    cap_add:
      - SYS_NICE  # Для приоритета audio потока
    
    networks:
      - yaesu-network
    
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Опционально: LM Studio для AI функций
  lm-studio:
    image: lmstudio/server:latest
    container_name: lm-studio
    restart: unless-stopped
    
    ports:
      - "1234:1234"
    
    volumes:
      - lm-models:/models
    
    environment:
      - MODEL=TheBloke/Mistral-7B-Instruct-v0.2-GGUF
    
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          memory: 4G
    
    networks:
      - yaesu-network

volumes:
  yaesu-data:
    driver: local
  lm-models:
    driver: local

networks:
  yaesu-network:
    driver: bridge
