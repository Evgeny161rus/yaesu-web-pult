name: Code Quality

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Install linters
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pylint mypy
    
    - name: Lint with flake8
      run: |
        # Stop build on syntax errors or undefined names
        flake8 server --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 server --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check with pylint
      continue-on-error: true
      run: |
        pylint server --exit-zero --disable=C,R --max-line-length=127
    
    - name: Type check with mypy
      continue-on-error: true
      run: |
        mypy server --ignore-missing-imports --no-strict-optional
