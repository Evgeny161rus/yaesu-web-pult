# Автоматическая сборка FTX1-Pult.exe на серверах GitHub.
# Загрузите проект в свой репозиторий GitHub → вкладка Actions → «Build FTX1-Pult.exe» → Run workflow.
# Готовый exe — в разделе Artifacts у завершённой сборки.
name: Build Yaesu-Web-Pult.exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt setuptools
      # FT8/FT4: модуль _ftx из ft8_lib (C, MIT) — собирается компилятором MSVC
      - name: Модуль FT8 (_ftx)
        working-directory: server
        run: python setup_ftx.py build_ext --inplace
      # Справочник стран для FT8 (Country Files, AD1C). Не скачался — программа скачает сама при запуске.
      - name: cty.dat
        shell: pwsh
        run: |
          try { Invoke-WebRequest https://www.country-files.com/cty/cty.dat -OutFile server\cty.dat -TimeoutSec 60 }
          catch { Write-Host "cty.dat не скачан: $_"; Set-Content server\cty.dat '' }
          (Get-Item server\cty.dat).Length
      # Загрузчик PyInstaller собираем из исходников: готовый загрузчик из pip
      # антивирусы (Microsoft Defender) часто ложно считают «Wacatac».
      - name: PyInstaller с собственным загрузчиком
        shell: pwsh
        run: |
          $env:PYINSTALLER_COMPILE_BOOTLOADER = '1'
          pip install --no-binary pyinstaller --no-cache-dir pyinstaller
      - run: >
          pyinstaller --noconfirm --clean --onefile --windowed --noupx --name Yaesu-Web-Pult
          --version-file version_info.txt
          --icon web\icon.ico --add-data "web;web" --add-data "server\menu_ftx1.json;." --add-data "server\cty.dat;."
          --hidden-import pystray._win32 --hidden-import _ftx --collect-all numpy --collect-all sounddevice
          --paths server server\main.py
      - name: Вариант-папка (ZIP) — реже вызывает подозрения антивируса
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --noupx --name Yaesu-Web-Pult --distpath distdir `
            --version-file version_info.txt `
            --icon web\icon.ico --add-data "web;web" --add-data "server\menu_ftx1.json;." --add-data "server\cty.dat;." `
            --hidden-import pystray._win32 --hidden-import _ftx --collect-all numpy --collect-all sounddevice `
            --paths server server\main.py
          Compress-Archive -Path distdir\Yaesu-Web-Pult -DestinationPath dist\Yaesu-Web-Pult-folder.zip
          (Get-FileHash dist\Yaesu-Web-Pult.exe -Algorithm SHA256).Hash + '  Yaesu-Web-Pult.exe' | Out-File dist\SHA256.txt
          (Get-FileHash dist\Yaesu-Web-Pult-folder.zip -Algorithm SHA256).Hash + '  Yaesu-Web-Pult-folder.zip' | Out-File dist\SHA256.txt -Append
      - name: Самопроверка exe (библиотеки и файлы)
        shell: pwsh
        run: |
          $p = Start-Process dist\Yaesu-Web-Pult.exe -ArgumentList '--selftest','selftest.txt' -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Проверка запуска сервера (симулятор)
        shell: pwsh
        run: |
          '{"open_panel": false, "auto_connect": true, "simulate": true}' | Set-Content dist\config.json
          $p = Start-Process dist\Yaesu-Web-Pult.exe -ArgumentList '--console' -PassThru -RedirectStandardOutput dist\output.log -RedirectStandardError dist\error.log
          Start-Sleep -Seconds 15
          try {
            $ping = (Invoke-WebRequest http://127.0.0.1:8080/api/ping -UseBasicParsing -TimeoutSec 5).Content
            $panel = (Invoke-WebRequest http://127.0.0.1:8080/panel.html -UseBasicParsing -TimeoutSec 5).StatusCode
            $pult = (Invoke-WebRequest http://127.0.0.1:8080/ -UseBasicParsing -TimeoutSec 5).StatusCode
            "ping: $ping  panel: $panel  pult: $pult"
            if (-not $ping.Contains('Yaesu') -or $panel -ne 200 -or $pult -ne 200) { 
              Write-Host "Server check failed"
              Get-Content dist\output.log
              Get-Content dist\error.log
              exit 1 
            }
          } catch {
            Write-Host "Error: $_"
            Get-Content dist\output.log
            Get-Content dist\error.log
            exit 1
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            Remove-Item dist\config.json, dist\cert.pem, dist\key.pem, dist\output.log, dist\error.log -ErrorAction SilentlyContinue
          }
      - uses: actions/upload-artifact@v4
        with:
          name: Yaesu-Web-Pult
          path: |
            dist/Yaesu-Web-Pult.exe
            dist/Yaesu-Web-Pult-folder.zip
            dist/SHA256.txt
      - name: Релиз «последняя сборка»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Yaesu Web Pult — Latest Build
          body: |
            ## 📥 Download
            
            **Yaesu-Web-Pult.exe** — single file, download and run (no Python required)
            
            **Yaesu-Web-Pult-folder.zip** — folder version (less likely to trigger antivirus)
            
            ## ⚠️ Windows Defender Warning
            
            PyInstaller executables sometimes trigger false positives. If Windows Defender blocks:
            1. Use the folder version (Yaesu-Web-Pult-folder.zip)
            2. Or add exception to Windows Defender
            3. All source code is open in this repository
            
            ## ✅ Features
            
            - 7 professional themes
            - Support for FTX-1, FT-710, FTDX10, FT-991, FT-891 and more
            - CW, FT8/FT4, RTTY, PSK31, NAVTEX, SSTV
            - Works on Raspberry Pi
            
            **SHA256 checksums:** SHA256.txt
            
            **Build:** ${{ github.sha }}
          make_latest: true
          overwrite_files: true
          files: |
            dist/Yaesu-Web-Pult.exe
            dist/Yaesu-Web-Pult-folder.zip
            dist/SHA256.txt
